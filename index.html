<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10121c">
<meta name="description" content="Bug Avcısı: İstanbul. Bilgisayar mühendisi kahramanla İstanbul'da geçen 9 dünya × 3 bölümlük özgün bir platform oyunu.">
<title>Bug Avcısı: İstanbul</title>
<style>
  :root { --gece: #10121c; --metin: #ece6d6; --soluk: #9aa0b4; --sari: #f4c531; --turkuaz: #22a391; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--gece); color: var(--metin); font-family: system-ui, sans-serif; min-height: 100dvh;
    display: grid; place-items: start center; }
  main { width: min(100vw, 900px); padding: 12px 16px 24px; }
  canvas#oyun { display: block; width: 100%; aspect-ratio: 256 / 240; background: #000;
    touch-action: none; border-radius: 4px; }
  .dugmeler { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .dugmeler button { font: inherit; font-size: 14px; color: var(--metin); background: #222638; border: 1px solid #3a4058; border-radius: 6px;
    padding: 9px 14px; cursor: pointer; touch-action: manipulation; }
  .dugmeler button:hover { background: #2c3148; }
  button:focus-visible { outline: 2px solid var(--sari); outline-offset: 2px; }
  p.bilgi { color: var(--soluk); text-align: center; line-height: 1.7; margin: 14px 0 0; font-size: 14px; }
  kbd { font: 12px ui-monospace, monospace; background: #222638; border: 1px solid #3a4058; border-radius: 4px; padding: 1px 5px; color: var(--metin); }

  /* Dokunmatik kumanda: yalnız dokunmatik ekranlarda. */
  .dokun { display: none; margin-top: 14px; justify-content: space-between; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .dokun { display: flex; } p.bilgi { display: none; } }
  .yonler { display: flex; gap: 8px; align-items: center; }
  .tus { touch-action: none; display: grid; place-items: center; color: #e8ecf6; font: 600 15px system-ui, sans-serif;
    background: #262b40; border: 2px solid #454c6c; border-radius: 12px; }
  .tus.basili { background: #3a4260; border-color: var(--sari); }
  .yon { width: min(17vw, 74px); height: min(17vw, 74px); font-size: 22px; }
  .yon.asagi { width: min(13vw, 56px); height: min(13vw, 56px); font-size: 18px; }
  .eylemler { display: flex; gap: 12px; align-items: center; }
  .yuvarlak { width: min(20vw, 86px); height: min(20vw, 86px); border-radius: 50%; }
  #tusZipla { background: #1f7a6c; border-color: #2fb39e; }
  #tusKos { background: #7a3a2a; border-color: #c8603e; width: min(16vw, 70px); height: min(16vw, 70px); font-size: 13px; }

  /* Yatay telefon: oyun ortada, tuşlar iki yanda. */
  @media (pointer: coarse) and (orientation: landscape) {
    body { overflow: hidden; }
    main { width: 100vw; height: 100dvh; padding: 6px max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    canvas#oyun { grid-column: 2; grid-row: 1; height: calc(100dvh - 12px); width: auto; max-width: 62vw; }
    .dokun { display: contents; }
    .yonler { grid-column: 1; grid-row: 1; justify-content: center; }
    .eylemler { grid-column: 3; grid-row: 1; justify-content: center; }
    .yon { width: min(9vw, 70px); height: min(9vw, 70px); }
    .yon.asagi { width: min(7vw, 52px); height: min(7vw, 52px); }
    .yuvarlak { width: min(11vw, 84px); height: min(11vw, 84px); }
    #tusKos { width: min(9vw, 68px); height: min(9vw, 68px); }
    .dugmeler { position: fixed; top: 6px; left: 8px; margin: 0; flex-direction: column; align-items: flex-start; gap: 4px; }
    .dugmeler button { padding: 4px 8px; font-size: 11px; opacity: 0.8; }
  }

  body.tv { overflow: hidden; }
  body.tv main { width: 100vw; height: 100vh; padding: 0; display: grid; place-items: center; }
  body.tv canvas#oyun { width: auto; height: 100vh; max-width: 100vw; border-radius: 0; }
  body.tv .dugmeler, body.tv p.bilgi, body.tv .dokun { display: none; }
</style>
</head>
<body>
<main>
  <canvas id="oyun" width="256" height="240" aria-label="Bug Avcısı oyun alanı"></canvas>
  <div class="dokun" aria-label="Dokunmatik kumanda">
    <div class="yonler">
      <div class="tus yon" id="tusSol" aria-label="Sol">◀</div>
      <div class="tus yon asagi" id="tusAsagi" aria-label="Aşağı">▼</div>
      <div class="tus yon" id="tusSag" aria-label="Sağ">▶</div>
    </div>
    <div class="eylemler">
      <div class="tus yuvarlak" id="tusKos" aria-label="Koş ve kod at">KOŞ<br>KOD</div>
      <div class="tus yuvarlak" id="tusZipla" aria-label="Zıpla">ZIPLA</div>
    </div>
  </div>
  <div class="dugmeler">
    <button id="duraklat" type="button">Duraklat</button>
    <button id="ses" type="button">Ses</button>
    <button id="tamEkran" type="button">Tam ekran</button>
  </div>
  <p class="bilgi"><kbd>←</kbd> <kbd>→</kbd> yürü · <kbd>Z</kbd> ya da <kbd>Boşluk</kbd> zıpla · <kbd>X</kbd> ya da <kbd>Shift</kbd> koş ve kod at · <kbd>↓</kbd> ince platformdan in<br>
  <kbd>P</kbd> duraklat · <kbd>M</kbd> ses · Oyun kolu da çalışır · Telefonu kumanda yapmak için menüden <b>Telefonla oyna</b> (<kbd>K</kbd>)</p>
</main>
<script src="src/levels.js"></script>
<script src="src/core.js"></script>
<script src="src/art.js"></script>
<script src="src/scenes.js"></script>
<script src="src/story.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
<script src="src/remote.js"></script>
</body>
</html>
