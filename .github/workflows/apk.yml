# Oyunu Android uygulaması (APK) olarak derler ve GitHub'daki Releases sayfasına koyar:
# https://github.com/hamiKumbasae/bug-avcisi/releases/latest
# Telefona kurmak için oradaki BugAvcisi.apk dosyasını telefondan indirip açmak yeterli.
name: APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'kumanda.html'
      - 'src/**'
      - 'mobil/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      ANAHTAR_VAR: ${{ secrets.BA_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Çekirdek testleri
        run: node tests/core.test.js && node tests/levels.test.js && node tests/moon.test.js

      - name: Android projesini hazırla
        working-directory: mobil
        run: |
          npm ci --no-audit --no-fund
          node hazirla.js www
          npx cap add android
          node hazirla.js android ${{ github.run_number }}
          npx capacitor-assets generate --android
          npx cap sync android

      - name: İmza anahtarı
        if: env.ANAHTAR_VAR == 'true'
        run: echo "${{ secrets.BA_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/oyun.jks"

      - name: APK derle
        working-directory: mobil/android
        env:
          BA_KEYSTORE: ${{ env.ANAHTAR_VAR == 'true' && format('{0}/oyun.jks', runner.temp) || '' }}
          BA_KEYSTORE_PASS: ${{ secrets.BA_KEYSTORE_PASS }}
          BA_KEY_ALIAS: ${{ secrets.BA_KEY_ALIAS }}
          BA_KEY_PASS: ${{ secrets.BA_KEY_PASS }}
        run: |
          chmod +x gradlew
          if [ -n "$BA_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BugAvcisi.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BugAvcisi.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/BugAvcisi.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BugAvcisi-apk
          path: BugAvcisi.apk

      - name: Releases sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bug Avcısı — Android 2.${{ github.run_number }}
          make_latest: true
          files: BugAvcisi.apk
          body: |
            **Telefona kurmak için:** aşağıdaki `BugAvcisi.apk` dosyasını telefonundan indir ve aç.
            Android "bilinmeyen kaynaklardan uygulama yükleme" izni isterse, tarayıcına (ya da Dosyalar uygulamasına) bu izni ver.

            Oyun yatay ekranda ve tam ekran açılır. Geri tuşu oyunu duraklatır; ana menüde uygulamadan çıkar.

            Kaynak: ${{ github.sha }}
