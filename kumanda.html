<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10121c">
<title>Bug Avcısı kumanda</title>
<style>
  :root { --gece: #10121c; --metin: #ece6d6; --soluk: #9aa0b4; --sari: #f4c531; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--gece); color: var(--metin); font: 15px system-ui, sans-serif; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  .sayfa { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .durum { display: flex; align-items: center; gap: 8px; color: var(--soluk); }
  .durum::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #5b6478; flex: none; }
  .durum.bagli { color: var(--metin); }
  .durum.bagli::before { background: #3ad13a; box-shadow: 0 0 8px #3ad13a; }
  .durum.hata { color: #ff9d85; } .durum.hata::before { background: #c4302a; }
  .rozet { padding: 5px 12px; border: 1px solid #454c6c; border-radius: 6px; font: 14px ui-monospace, monospace; color: var(--sari); }

  .kol { display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; gap: 12px; min-height: 0; }
  #yon { position: relative; width: min(44vw, 64vh, 280px); aspect-ratio: 1; touch-action: none; }
  #yon::before, #yon::after { content: ''; position: absolute; background: #262b40; border: 2px solid #454c6c; border-radius: 10px; }
  #yon::before { left: 33%; right: 33%; top: 0; bottom: 0; }
  #yon::after { top: 33%; bottom: 33%; left: 0; right: 0; }
  #yon span { position: absolute; z-index: 1; font-size: 26px; color: #c8cce0; transform: translate(-50%, -50%); pointer-events: none; }
  #yon[data-yon="up"] .u, #yon[data-yon="down"] .d, #yon[data-yon="left"] .l, #yon[data-yon="right"] .r { color: var(--sari); }
  .eylem { display: flex; gap: 16px; align-items: center; }
  .eylem button { touch-action: none; border-radius: 50%; font: 600 17px system-ui, sans-serif; color: #fff; }
  #zipla { width: min(30vw, 50vh, 170px); aspect-ratio: 1; background: #1f7a6c; border: 4px solid #2fb39e; }
  #kos { width: min(22vw, 38vh, 124px); aspect-ratio: 1; background: #7a3a2a; border: 4px solid #c8603e; font-size: 14px; align-self: flex-end; }
  .eylem button.basili { filter: brightness(0.8); transform: translateY(3px); }
  .alt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .alt button { font: inherit; color: var(--metin); background: #222638; border: 1px solid #3a4058; border-radius: 8px;
    padding: 12px 6px; min-height: 48px; touch-action: manipulation; }
  .ipucu { grid-column: 1 / -1; text-align: center; color: var(--soluk); font-size: 13px; min-height: 1.3em; }

  #giris { display: grid; align-content: center; gap: 14px; text-align: center; padding: 0 8px; grid-row: 2; }
  #giris[hidden], #kumanda[hidden] { display: none; }
  #giris h1 { margin: 0; font-size: 21px; font-weight: 600; color: var(--sari); }
  #giris p { margin: 0; color: var(--soluk); line-height: 1.6; }
  #kod { font: 30px ui-monospace, monospace; letter-spacing: 0.25em; text-align: center; text-transform: uppercase; width: 100%; padding: 12px 8px;
    background: #070810; color: var(--sari); border: 1px solid #454c6c; border-radius: 8px; }
  #baglan { font: 600 18px system-ui, sans-serif; padding: 12px; color: #1d1600; background: var(--sari); border: 0; border-radius: 8px; }
  #kumanda { display: contents; }
  @media (orientation: portrait) {
    .kol { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    #yon { width: min(66vw, 32vh, 280px); }
    .eylem { justify-self: end; }
    #zipla { width: min(36vw, 20vh, 170px); }
    #kos { width: min(26vw, 15vh, 124px); }
  }
</style>
</head>
<body>
<div class="sayfa">
  <header>
    <div class="durum" id="durum" role="status">Bağlanıyor…</div>
    <div class="rozet" id="rozet">—</div>
  </header>

  <form id="giris" hidden>
    <h1>Telefonu kumanda yap</h1>
    <p>Bilgisayarda ya da TV'de Bug Avcısı'nı aç, <b>Telefonla oyna</b>'ya bas (K). QR kodu okut ya da 6 karakterlik kodu yaz.</p>
    <input id="kod" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Bağlantı kodu" placeholder="······">
    <button id="baglan" type="submit">Bağlan</button>
  </form>

  <div id="kumanda" hidden>
    <div class="kol">
      <div id="yon" role="group" aria-label="Yön tuşları">
        <span class="u" style="left:50%;top:16%">▲</span><span class="d" style="left:50%;top:84%">▼</span>
        <span class="l" style="left:16%;top:50%">◀</span><span class="r" style="left:84%;top:50%">▶</span>
      </div>
      <div class="eylem">
        <button id="kos" type="button">KOŞ<br>KOD</button>
        <button id="zipla" type="button">ZIPLA</button>
      </div>
    </div>
    <div class="alt">
      <div class="ipucu" id="ipucu"></div>
      <button id="duraklat" type="button">Duraklat</button>
      <button id="menu" type="button">Geri / Menü</button>
    </div>
  </div>
</div>

<script src="src/vendor/peerjs.min.js"></script>
<script>
// Bug Avcısı — telefon kumandası. Ekran tarafı ve mesaj biçimi: src/remote.js
(function () {
  'use strict';
  const PREFIX = 'bugavcisi-';
  const $ = (id) => document.getElementById(id);
  const statusEl = $('durum'), badge = $('rozet'), hint = $('ipucu'), pad = $('yon');
  const params = new URLSearchParams(location.search);
  function peerOptions() {
    const p = params.get('peer');
    if (!p) return { debug: 0 };
    const [host, port] = p.split(':');
    const local = /^(localhost|127\.|192\.168\.|10\.)/.test(host);
    return { debug: 1, host, port: +port || (local ? 9000 : 443), path: '/', secure: !local };
  }
  const setStatus = (t, k) => { statusEl.textContent = t; statusEl.className = 'durum' + (k ? ' ' + k : ''); };
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* yok say */ } };

  // ---------- kod ----------
  const clean = (s) => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  let code = clean(decodeURIComponent(location.hash.slice(1)));
  $('giris').addEventListener('submit', (e) => {
    e.preventDefault();
    const c = clean($('kod').value);
    if (c.length !== 6) { setStatus('Kod 6 karakter olmalı.', 'hata'); return; }
    code = c; history.replaceState(null, '', '#' + code); begin();
  });
  $('kod').addEventListener('input', (e) => { e.target.value = clean(e.target.value); });

  // ---------- bağlantı ----------
  let peer = null, conn = null, retryTimer = null, openTimer = null;
  function begin() {
    $('giris').hidden = true; $('kumanda').hidden = false;
    setStatus('Bağlanıyor…');
    if (!peer || peer.destroyed) {
      peer = new window.Peer(undefined, peerOptions());
      peer.on('open', connect);
      peer.on('disconnected', () => setTimeout(() => { if (!peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500));
      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') { dropPending(); setStatus('Oyun bulunamadı. Oyunda kumanda paneli açık mı?', 'hata'); retry(3000); }
        else if (err.type === 'browser-incompatible') setStatus('Bu tarayıcı WebRTC desteklemiyor.', 'hata');
        else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) { setStatus('Sunucuya ulaşılamadı. Tekrar deneniyor…', 'hata'); retry(4000); }
      });
    } else if (peer.open) connect();
  }
  function retry(ms) {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (!peer || peer.destroyed) { begin(); return; } if (peer.disconnected) { peer.reconnect(); return; } connect(); }, ms);
  }
  function dropPending() {
    clearTimeout(openTimer);
    const c = conn; if (!c || c.open) return;
    conn = null; c._yeni = false; try { c.close(); } catch (e) { /* yok say */ }
  }
  function connect() {
    if (conn && (conn.open || conn._yeni)) return;
    clearTimeout(retryTimer);
    const c = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    c._yeni = true; conn = c;
    clearTimeout(openTimer);
    openTimer = setTimeout(() => { if (conn === c && !c.open) { dropPending(); retry(500); } }, 10000);
    c.on('open', () => { c._yeni = false; clearTimeout(openTimer); setStatus('Bağlandı', 'bagli'); c.send({ t: 'h' }); resend(); buzz(30); keepAwake(); });
    c.on('data', onData);
    c.on('close', () => { if (conn !== c) return; conn = null; setStatus('Bağlantı koptu, yeniden bağlanıyor…', 'hata'); retry(2000); });
    c.on('error', () => { /* close ayrıca gelir */ });
  }
  const send = (m) => { if (conn && conn.open) conn.send(m); };
  setInterval(() => send({ t: 'p' }), 1000); // nabız: oyun kopmayı böyle anlar
  window.addEventListener('pagehide', () => { send({ t: 'bye' }); try { conn && conn.close(); } catch (e) { /* yok say */ } });

  // ---------- oyundan gelenler ----------
  function onData(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'v') { buzz(m.p || 60); return; }
    if (m.t !== 's') return;
    badge.textContent = m.stage ? `${m.stage} · ♥∞` : 'BUG AVCISI';
    const menu = m.screen !== 'play';
    hint.textContent = m.paused ? 'Duraklatıldı: ▲▼ ile seç, ZIPLA ile onayla'
      : menu ? 'Menü: ▲▼ ile seç, ZIPLA ile onayla'
      : m.power === 2 ? 'KOŞ tuşu { } kod da fırlatır' : '';
    $('duraklat').textContent = m.paused ? 'Devam' : 'Duraklat';
  }

  // ---------- yön haçı ----------
  let pid = null, dir = null, sentDir;
  function sendDir() { if (dir !== sentDir) { sentDir = dir; send({ t: 'dir', d: dir }); } }
  function setDir(e) {
    const r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    // Platform oyununda sol/sağ öncelikli: dikey yalnız belirgin dikey sürüşte.
    const d = Math.hypot(dx, dy) < r.width * 0.1 ? null : Math.abs(dy) > Math.abs(dx) * 1.6 ? (dy > 0 ? 'down' : 'up') : (dx > 0 ? 'right' : 'left');
    if (d !== dir) { dir = d; pad.dataset.yon = d || ''; if (d) buzz(8); sendDir(); }
  }
  pad.addEventListener('pointerdown', (e) => { e.preventDefault(); if (pid !== null) return; pid = e.pointerId; try { pad.setPointerCapture(pid); } catch (err) { /* yok say */ } setDir(e); keepAwake(); });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === pid) setDir(e); });
  const release = (e) => { if (e.pointerId !== pid) return; pid = null; dir = null; pad.dataset.yon = ''; sendDir(); };
  pad.addEventListener('pointerup', release); pad.addEventListener('pointercancel', release); pad.addEventListener('lostpointercapture', release);

  // ---------- basılı tutulan tuşlar ----------
  const held = { jump: false, run: false };
  function hold(btn, name) {
    let p = null;
    const on = (e) => { e.preventDefault(); if (p !== null) return; p = e.pointerId; try { btn.setPointerCapture(p); } catch (err) { /* yok say */ } btn.classList.add('basili'); held[name] = true; send({ t: 'k', b: name, on: true }); buzz(12); keepAwake(); };
    const off = (e) => { if (e.pointerId !== p) return; p = null; btn.classList.remove('basili'); held[name] = false; send({ t: 'k', b: name, on: false }); };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off); btn.addEventListener('lostpointercapture', off);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  hold($('zipla'), 'jump');
  hold($('kos'), 'run');
  function resend() { sentDir = undefined; sendDir(); for (const k of ['jump', 'run']) send({ t: 'k', b: k, on: held[k] }); }
  $('duraklat').addEventListener('click', () => send({ t: 'b', b: 'pause' }));
  $('menu').addEventListener('click', () => send({ t: 'b', b: 'menu' }));
  function releaseAll() {
    if (dir) { dir = null; pad.dataset.yon = ''; sendDir(); }
    for (const k of ['jump', 'run']) if (held[k]) { held[k] = false; send({ t: 'k', b: k, on: false }); }
  }
  window.addEventListener('blur', releaseAll);

  // ---------- ekran açık kalsın ----------
  let wakeLock = null;
  async function keepAwake() {
    if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { /* yok say */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') { releaseAll(); return; }
    keepAwake(); if (code && !(conn && conn.open)) retry(200);
  });

  if (!window.Peer) { setStatus('Kumanda dosyası yüklenemedi. Sayfayı yenile.', 'hata'); return; }
  if (code.length === 6) begin(); else { $('giris').hidden = false; setStatus('Kod bekleniyor'); }
})();
</script>
</body>
</html>
